conifg_name: "bitgen_vs_base"

# Two unmodified schemes selected from the official
# configs/exec/exec_opt_breakdown_arpg_1input.yaml artifact configuration.
common_params:
  input-size: 1000000
  repeat-input: 1
  multi-input: 1
  split-input: 1
  regex_num_from_file: -1
  cuda_block_size: 512
  cuda-register-num: 96
  parallel_compile_parabix: 1
  parallel_compile_cuda: 1
  parallel_compile_cuda_lto: 0
  warmup_iters: 8
  exec_iters: 8

schemes:
  - name: "ac_cuda_fuse_basic"
    type: "ac"
    env: "python ${BITGEN_ROOT}/scripts/run_bitgen.py"
    params:
      backend: "cuda"
      regex_group_number: 256
      pass-cc-advanced: 0
      pass-short-circuit: 0
      pass-graph-break: 2

  - name: "ac_cuda_fuse_all_o3_2"
    type: "ac"
    env: "python ${BITGEN_ROOT}/scripts/run_bitgen.py"
    params:
      backend: "cuda"
      regex_group_number: 256
      pass-cc-advanced: 1
      pass-cc-advanced-max: 8
      pass-short-circuit: 1
      pass-short-circuit-interval: 2
      pass-short-circuit-syncpoint: 0
      pass-graph-break: -1
